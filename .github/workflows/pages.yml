# Builds and deploys the static site to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# The price snapshot is refreshed every 12 hours by searching the watchlist
# (src/price/watchlist.js) through the same rate-limited pipeline as the server:
# <= 6 requests/min per retailer, one at a time, robots.txt respected.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      demo:
        description: 'Publish sample price data instead of live lookups'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh price snapshot (rate-limited)
        run: node scripts/snapshot-prices.js _site/data/prices.json ${{ inputs.demo && '--demo' || '' }}
      - name: Build static site
        run: node scripts/build-static.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
